# Create the app at https://api.slack.com/apps → Create New App → From a manifest.
# Then: Basic Information → App-Level Tokens → generate one with `connections:write` (SLACK_APP_TOKEN),
# and Install App → copy the Bot User OAuth Token (SLACK_BOT_TOKEN).
display_information:
  name: Pi
  description: Pi coding agent on my server
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: pi
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - chat:write
      - files:read
      - files:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
